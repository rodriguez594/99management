<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>99MS has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://99ms.dk/">
<meta name="theme-color" content="#1f2124">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { background: #1f2124; color: #f4f5f6; font: 14px/1.6 system-ui, -apple-system, sans-serif; display: grid; place-items: center; text-align: center; padding: 16px; box-sizing: border-box; }
  a { color: #f4f5f6; }
</style>
</head>
<body>
<p>99MS has moved to <a id="go" href="https://99ms.dk/">99ms.dk</a></p>
<script>
  // The app now lives at 99ms.dk. Data saved in this browser at this address goes along in the
  // URL hash, and 99ms.dk asks before adding it.
  (() => {
    const target = "https://99ms.dk/";
    let hash = "";
    try {
      const cfg = JSON.parse(localStorage.getItem("salary-clock") || "null");
      const log = JSON.parse(localStorage.getItem("salary-clock-log") || "null");
      const count = log ? ["shifts", "savings", "items"].reduce((n, k) => n + (Array.isArray(log[k]) ? log[k].length : 0), 0) : 0;
      if (cfg || count) {
        const json = JSON.stringify({ app: "99ms-move", cfg, log: log || {} });
        hash = "#import=" + btoa(unescape(encodeURIComponent(json))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }
    } catch {}
    document.getElementById("go").href = target + hash;
    location.replace(target + hash);
  })();
</script>
</body>
</html>
